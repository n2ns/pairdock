[package]
name = "boltkit"
version = "0.1.0"
description = "Pair and configure Logitech Bolt/Unifying devices without Logi Options+"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boltkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
serde.workspace = true
serde_json.workspace = true
boltkit-core.workspace = true
hidpp.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

