[package]
name = "hidpp"
version = "0.3.0"
edition = "2024"
description = "An implementation of the HID++ protocol used by Logitech devices"
license-file = "LICENSE"
repository = "https://github.com/lus/logy"
keywords = ["hid++", "logitech", "hid", "mouse", "keyboard"]
categories = ["hardware-support"]

[dependencies]
thiserror = "2.0.21"
hidreport = "0.6.0"
futures = "0.3.34"
async-trait = "0.1.92"
rand = "0.10.3"
lazy_static = "1.5.1"
num_enum = "0.7.6"
async-channel = "2.5.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
hex = "0.4.3"
derive_builder = "0.20.2"